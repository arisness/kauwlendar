[package]
name = "kauwlendar"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
ureq = { version = "2.9", default-features = false, features = ["tls"] }
chrono = { version = "0.4" }
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
